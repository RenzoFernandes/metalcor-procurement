spring:
  application:
    name: procurement-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:metalcor}
    username: ${APP_DB_USER:metalcor_app}
    # No default on purpose: the app does not start without it.
    password: ${APP_DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true

# Second, read-only datasource for the copilot and technical mode. Same database, different role
# (metalcor_readonly, CONNECTION LIMIT 5 in V10), so the pool here stays small.
copilot:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:metalcor}
    username: ${READONLY_DB_USER:metalcor_readonly}
    password: ${READONLY_DB_PASSWORD}
    max-pool-size: 3
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5-coder:7b}

app:
  copilot:
    # Which model provider answers the copilot: ollama (local, default) or gemini (hosted, Google Gemini API).
    provider: ${COPILOT_PROVIDER:ollama}
    # Questions per user per minute on /copilot/query (each one spends model quota and a read-only connection).
    rate-limit-per-minute: ${COPILOT_RATE_LIMIT_PER_MINUTE:10}
    gemini:
      base-url: https://generativelanguage.googleapis.com
      # No default on purpose and never committed: only needed when provider=gemini.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
